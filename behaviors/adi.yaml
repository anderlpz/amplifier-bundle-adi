---
bundle:
  name: adi-behavior
  version: 0.2.0
  description: >
    Thin wiring for ADI's invoke-then-load surface. Registers the two agents
    (adi-orchestrator, quality-gate) as cheap name+description metadata only —
    their heavy tool/sub-bundle/context composition lives in the agent files
    themselves and loads only when spawned via delegate. Also wires the
    /adi skill so it is discoverable as a slash command.

agents:
  include:
    - adi:adi-orchestrator
    - adi:quality-gate

tools:
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    config:
      skills:
        # Foundation (composed in bundle.md) already brings the curated skills
        # collection via its own tool-skills declaration. Re-declaring the
        # curated source here too, alongside "@adi:skills", guarantees the
        # /adi skill survives regardless of exactly how the two tool-skills
        # declarations (foundation's default + this one) get merged during
        # composition -- rather than depending solely on cross-bundle list
        # concatenation, which DTU validation showed does not reliably
        # surface this bundle's own skill. This is the same pattern
        # documented in amplifier-bundle-skills' own README under "Add your
        # own skills alongside curated ones".
        - "git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=skills"
        - "@adi:skills"
