---
bundle:
  name: adi
  version: 0.2.0
  description: >
    Thin wiring for ADI's invoke-then-load surface. Registers the two agents
    (adi-orchestrator, quality-gate) as cheap name+description metadata only —
    their heavy tool/sub-bundle/context composition lives in the agent files
    themselves and loads only when spawned via delegate. Also wires the
    /adi skill so it is discoverable as a slash command.

agents:
  include:
    - adi:adi-orchestrator
    - adi:quality-gate

tools:
  # Point the skills tool at ADI's own skills/ directory so the /adi front door
  # is discovered. IMPORTANT: the mount-time resolver for `config.skills` only
  # handles remote (git+/https) sources and literal filesystem paths — it does
  # NOT resolve "@namespace:path" mentions (those are silently dropped at debug
  # level). So we must use the git+subdirectory form here, not "@adi:skills".
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    config:
      skills:
        - "git+https://github.com/anderlpz/amplifier-bundle-adi@main#subdirectory=skills"
