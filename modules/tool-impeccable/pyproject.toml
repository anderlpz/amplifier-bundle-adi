[project]
name = "amplifier-module-tool-impeccable"
version = "0.1.0"
description = "Wraps the impeccable design-slop detector CLI, returning CLEAN or structured findings."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.entry-points."amplifier.modules"]
tool-impeccable = "amplifier_module_tool_impeccable:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_impeccable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
