# ADI Convergence Recipe (Phase 1 Placeholder)
#
# The full ADI convergence loop:
#   render matrix -> Tier 1 Impeccable -> fix loop -> Tier 2 Design Intelligence
#   -> fix loop back to Tier 1 -> quality gate -> done, or escalate at 5 iterations
#
# PHASE 1 PLACEHOLDER — full orchestration is implemented in Phase 2.
#
# Phase 2 will implement:
#   - Control flow for the full convergence loop described above.
#   - Iteration counter with an escape hatch: after 5 iterations, escalate to a
#     human instead of looping forever.
#   - Tier 1 deterministic branching on the tool-impeccable module's CLEAN/FINDINGS
#     result.
#   - Invocation of the quality-gate agent for Tier 2 semantic judgment.
#   - Loop-back to Tier 1 after any Tier 2 fix, so a semantic fix can't silently
#     reintroduce a deterministic slop violation.
#   - Cost observability event emission (per-tier, per-iteration cost tracking).

name: adi-convergence
version: 0.1.0
description: |
  Orchestrates ADI's convergence loop: render matrix, then Tier 1 (Impeccable
  deterministic slop detection), then a fix loop, then Tier 2 (Design
  Intelligence semantic evaluation), then a fix loop that returns to Tier 1,
  then the quality gate's certification — or escalation to a human after 5
  iterations without convergence. PHASE 1 PLACEHOLDER — full orchestration in
  Phase 2.

context:
  {}
  # target_url: ""       # Required (Phase 2): URL of the rendered surface to evaluate.
  # render_matrix: ""    # Required (Phase 2): the set of viewports/states to render and check.

steps:
  - id: phase-1-placeholder
    agent: adi:quality-gate
    prompt: |
      Phase 1 placeholder step. This recipe does not yet implement the ADI
      convergence loop. Phase 2 will replace this step with the full
      orchestration described in the file header comments.
    output: placeholder_result
